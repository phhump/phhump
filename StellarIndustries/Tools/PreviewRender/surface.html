  rov.position.set(ex+toBase.y*9,height(ex+toBase.y*9,ez-toBase.x*9),ez-toBase.x*9);rov.rotation.y=-.9;scene.add(rov);
  focus=new THREE.Vector3(ex+toBase.x*25,height(ex,ez)+4,ez+toBase.y*25);camPos=new THREE.Vector3(ex-toBase.x*10-toBase.y*5,height(ex,ez)+4,ez-toBase.y*10+toBase.x*5);
  floats.push(['+2 '+p.name,'#e0e0e0',new THREE.Vector3(ex,height(ex,ez)+3.2,ez)]);prompt='[Hold F] Drill '+p.name+' by hand';
  if(earthSky){const d=focus.clone().sub(camPos);d.y=0;d.normalize();d.applyAxisAngle(new THREE.Vector3(0,1,0),-.25);d.y=.24;d.normalize();earthSky.position.copy(camPos).add(d.multiplyScalar(3500));earthSky.rotation.z=-.41}}
if(isMoon){const d=camPos.clone().sub(focus);d.y=0;d.normalize();d.applyAxisAngle(new THREE.Vector3(0,1,0),.9);d.y=.5;sunDir.copy(d.normalize());sunSp.position.copy(camPos).add(sunDir.clone().multiplyScalar(3800));}
cam.position.copy(camPos);cam.lookAt(focus);sun.target.position.copy(focus);scene.add(sun.target);sun.position.copy(focus).add(sunDir.clone().multiplyScalar(300));
renderer.render(scene,cam);
// --- HUD (mirrors SurfaceHud) ---
const col=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const fmt=v=>{let a=Math.abs(v),s=['','K','M'],i=0;while(a>=1000&&i<2){a/=1000;v/=1000;i++}return (a<10&&a%1?v.toFixed(1):a<100&&i?v.toFixed(2):Math.round(v))+s[i]};
const res=S.inv.map(r=>`<div style="display:flex;height:22px;align-items:center;font-size:12px"><span style="width:11px;height:11px;border-radius:6px;background:${r.color};margin:0 8px 0 2px"></span><span style="flex:1">${r.name}</span><span style="color:${r.amt>=r.cap?col('warn'):col('tx')}">${fmt(r.amt)}</span>${r.rate?`<span style="width:70px;text-align:right;color:${r.rate>0?col('good'):col('bad')}">${r.rate>0?'+':''}${Math.abs(r.rate)<.1?(r.rate*60).toFixed(1)+'/min':r.rate.toFixed(2)+'/s'}</span>`:'<span style="width:70px"></span>'}</div>`).join('');

  for(const b of S.buildings){const [x,y]=mp(b.x,b.z);o+=`<div style="position:absolute;left:${x-2.5}px;top:${y-2.5}px;width:5px;height:5px;background:${b.status=='Working'?col('good'):col('warn')}"></div>`}
  const [ex,ey]=mp(eng.position.x,eng.position.z);o+=`<div style="position:absolute;left:${ex-4.5}px;top:${ey-4.5}px;width:9px;height:9px;border-radius:5px;background:var(--cy)"></div>`;return o};
const proj=v=>{const p=v.clone().project(cam);return [(p.x+1)/2*W,(1-p.y)/2*H]};
let fl='';for(const [t,c,v] of floats){const [x,y]=proj(v);fl+=`<div class="float" style="left:${x}px;top:${y}px;color:${c}">${t}</div>`}
const center=(txt,y)=>`<div class="glass" style="left:50%;transform:translateX(-50%);top:${y}px;padding:9px 18px;white-space:nowrap">${txt}</div>`;
let mid='';
if(palette){mid+=center('<span style="color:var(--good)">Left click: build Research Laboratory</span> &nbsp; R: rotate &nbsp; Esc: cancel',H-168)+`<div style="position:absolute;left:50%;transform:translateX(-50%);top:${H-196}px;font-size:12px">Cost: 15 Iron Plate &nbsp;10 Copper Wire</div>`;
  const defs=[['Surface Mine','12 Iron Plate','-2 MW'],['Smelter','15 Iron Plate','-3 MW'],['Research Laboratory','15 Iron Plate 10 Copper Wire','-2 MW'],['Wind Turbine','10 Iron Plate 5 Copper Wire','+6 MW'],['Component Factory','20 Iron Plate 10 Copper Wire','-3 MW'],['Warehouse','20 Iron Plate',''],['Water Pump','10 Iron Plate 5 Copper Wire','-1 MW']];
  mid+=`<div class="glass" style="left:${W/2-560}px;top:${H-330}px;width:1120px;height:150px;padding:8px 18px"><b>BUILD</b> <span class="dim">choose a structure, then place it in the world (B / Esc to close)</span><div style="display:flex;gap:8px;margin-top:8px">${defs.map((d,i)=>`<div style="width:152px;height:92px;border-radius:8px;padding:8px 10px;background:${i==2?'linear-gradient(180deg,#1c567a,#12384f)':'linear-gradient(180deg,#24365a,#16223a)'};border:1px solid ${i==2?'rgba(115,230,255,.85)':'rgba(115,205,255,.35)'}"><b style="font:12.5px BodyB">${d[0]}</b><div style="font-size:10.5px;margin:3px 0">${d[1]}</div><div style="font-size:11px;color:${d[2][0]=='+'?col('good'):col('warn')}">${d[2]}</div></div>`).join('')}</div></div>`}
else if(prompt)mid+=center(prompt,H-168);
if(shot=='moon')mid+=`<div style="position:absolute;left:50%;transform:translateX(-50%);top:${H-196}px;font-size:12px"><span class="dim">Standing on a</span> Regolith <span class="dim">field · richness 150%</span></div>`;
if(shot=='earth')mid+=`<div class="glass" style="left:${W-430}px;top:${H-420}px;width:420px;height:230px;padding:14px 18px"><div style="display:flex"><b style="font:18px BodyB;flex:1">${tgt.name} <span class="dim">Lv ${tgt.lv}</span></b><span class="btn" style="padding:3px 12px">Close</span></div><div class="dim">Turns ore into metals.</div><div style="display:flex;gap:10px;margin:8px 0"><span style="padding:1px 10px;border-radius:9px;font:11px BodyB;color:var(--good);background:#46e2962e">Working</span><div class="bar" style="width:160px"><i style="width:110px"></i><em>${tgt.status}</em></div></div><div><span class="btn" style="padding:2px 9px">&lt;</span> &nbsp;${tgt.recipe}&nbsp; <span class="btn" style="padding:2px 9px">&gt;</span></div><div style="position:absolute;bottom:16px;display:flex;gap:6px"><span class="btn acc">Upgrade</span><span class="btn">Pause</span><span class="btn">Norm</span><span class="btn">Demolish</span></div></div>`;
document.getElementById('ui').innerHTML=`<div class="top"><div class="logo" style="width:270px"><b>STELLAR <i>INDUSTRIES</i></b><span>Preview Empire · ${SN.play}</span></div>
<div class="sel"><b style="font:15px BodyB">${S.name}</b><br><small style="color:var(--dim);font-size:11px">Sol · ${SN.locations.length} worlds</small></div>
<div class="stat" style="width:150px"><small>ENERGY</small><span style="color:var(--good)">${fmt(SN.supply)} / ${fmt(SN.demand)} MW</span></div><div class="stat" style="width:150px"><small>SCIENCE</small><span style="color:var(--cy)">${fmt(SN.science)}</span></div>
<div class="stat" style="width:220px"><small>RESEARCH</small>${SN.research?`<div class="bar" style="width:210px"><i style="width:${SN.rfrac*210}px"></i><em>${SN.research}</em></div>`:'<span style="color:var(--warn)">idle</span>'}</div>
<div style="margin-left:auto;display:flex;gap:8px"><span class="btn">Orbit view</span><span class="btn">Command</span><span class="btn">Save</span></div></div>
<div class="glass" style="left:10px;top:74px;width:240px;padding:8px 12px">${res}</div>

<div style="position:absolute;left:16px;top:${H-58}px"><b>${S.name}</b> <span class="dim">${S.gravity.toFixed(2)} g · ${S.temp} °C · ${S.atm}</span></div>

${SN.objective?`<div class="glass" style="right:10px;bottom:10px;width:330px;padding:8px 14px 10px 20px"><div class="dim">CURRENT OBJECTIVE</div><div style="margin:2px 0 7px"><span style="color:var(--or)">${SN.objective.split(' - ')[0]}</span> <span style="font-size:12px">${SN.objective.split(' - ')[1]}</span></div><div class="bar" style="--c:#ff963c"><i style="width:${Math.min(1,SN.objp)*296}px"></i></div></div>`:''}
